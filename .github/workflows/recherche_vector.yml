name: Deploy RechercheVector

on:
  push:
    branches:
      - recherche_vector

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/luckymusk5/skylis_backend/recherche_vector

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/recherche-vector \
            recherche-vector=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n skylis-prod

          kubectl rollout status deployment/recherche-vector \
            -n skylis-prod \
            --timeout=120s

      - name: Verify deployment
        run: |
          kubectl get pods -n skylis-prod -l app=recherche-vector
