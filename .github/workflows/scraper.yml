name: Deploy Scraper

on:
  push:
    branches:
      - scrape

env:
  IMAGE_NAME: ghcr.io/luckymusk5/skylis_backend/scraper

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: luckymusk5
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "${KUBE_CONFIG}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/scraper \
            scraper=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n skylis-prod
          kubectl rollout status deployment/scraper \
            -n skylis-prod \
            --timeout=120s

      - name: Verify deployment
        run: kubectl get pods -n skylis-prod -l app=scraper
